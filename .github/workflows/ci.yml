name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triageforge
          POSTGRES_PASSWORD: triageforge
          POSTGRES_DB: triageforge
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U triageforge -d triageforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://triageforge:triageforge@127.0.0.1:54329/triageforge
      TEST_DATABASE_URL: postgres://triageforge:triageforge@127.0.0.1:54329/triageforge
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Migration integration test
        run: pnpm --filter @triageforge/api test -- migrations.test.ts

      - name: Build
        run: pnpm build
