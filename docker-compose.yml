services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triageforge-postgres
    environment:
      POSTGRES_DB: triageforge
      POSTGRES_USER: triageforge
      POSTGRES_PASSWORD: triageforge
    ports:
      - "54329:5432"
    volumes:
      - triageforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triageforge -d triageforge"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  triageforge-postgres-data:
